---
- name: Install Docker dependencies
  apt:
    name: [ca-certificates, curl, gnupg]
    state: present

- name: Create Docker keyring directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker GPG key
  shell: |
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
      | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg

- name: Add Docker apt repository
  shell: |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
    https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo $VERSION_CODENAME) stable" \
    | tee /etc/apt/sources.list.d/docker.list > /dev/null
  args:
    creates: /etc/apt/sources.list.d/docker.list

- name: Install Docker
  apt:
    name: [docker-ce, docker-ce-cli, containerd.io]
    state: present
    update_cache: yes

- name: Enable and start Docker
  systemd:
    name: docker
    enabled: yes
    state: started

- name: Add ubuntu user to docker group
  user:
    name: ubuntu
    groups: docker
    append: yes

- name: Create jenkins user
  user:
    name: jenkins
    shell: /bin/bash
    create_home: yes

- name: Add jenkins user to docker group
  user:
    name: jenkins
    groups: docker
    append: yes

- name: Enable SSH public key authentication
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PubkeyAuthentication'
    line: 'PubkeyAuthentication yes'

- name: Enable authorized keys file
  lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?AuthorizedKeysFile'
    line: 'AuthorizedKeysFile .ssh/authorized_keys'

- name: Restart SSH
  systemd:
    name: ssh
    state: restarted

- name: Pull master public key from SSM
  command: >
    aws ssm get-parameter
    --name "{{ ssm_parameter_name }}"
    --query Parameter.Value
    --output text
    --region {{ aws_region }}
  register: master_public_key

- name: Ensure .ssh directory exists for jenkins user
  file:
    path: /home/jenkins/.ssh
    state: directory
    owner: jenkins
    group: jenkins
    mode: '0700'

- name: Add master public key to jenkins authorized_keys
  authorized_key:
    user: jenkins
    key: "{{ master_public_key.stdout }}"
    state: present

- name: Verify authorized_keys was written
  command: wc -l /home/jenkins/.ssh/authorized_keys
  register: authkeys_check
  changed_when: false
  failed_when: authkeys_check.rc != 0 or authkeys_check.stdout.split()[0] | int == 0
