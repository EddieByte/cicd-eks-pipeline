---
- name: Create Jenkins keyring directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Jenkins GPG key
  shell: |
    curl -fsSL https://pkg.jenkins.io/debian/jenkins.io-2026.key | \
    gpg --dearmor -o /etc/apt/keyrings/jenkins-keyring.gpg --yes
  args:
    creates: /etc/apt/keyrings/jenkins-keyring.gpg

- name: Add Jenkins apt repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.gpg] https://pkg.jenkins.io/debian binary/"
    state: present
    filename: jenkins

- name: Install Jenkins
  apt:
    name: jenkins
    state: present
    update_cache: yes

- name: Create Jenkins configuration directory
  file:
    path: /etc/jenkins
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Copy the plugin manifest to the Jenkins host
  copy:
    src: plugins.txt
    dest: /etc/jenkins/plugins.txt
    owner: root
    group: root
    mode: '0644'
  when: jenkins_manage_configuration | bool

- name: Install the declared Jenkins plugin set
  command: jenkins-plugin-cli --plugin-file /etc/jenkins/plugins.txt
  register: jenkins_plugin_install
  changed_when: "'Downloaded' in jenkins_plugin_install.stdout or 'Installed' in jenkins_plugin_install.stdout"
  when: jenkins_manage_configuration | bool

- name: Create the JCasC configuration directory
  file:
    path: /var/lib/jenkins/casc_configs
    state: directory
    owner: jenkins
    group: jenkins
    mode: '0750'
  when: jenkins_manage_configuration | bool

- name: Create the Jenkins systemd override directory
  file:
    path: /etc/systemd/system/jenkins.service.d
    state: directory
    mode: '0755'
  when: jenkins_manage_configuration | bool

- name: Configure Jenkins Configuration as Code at service startup
  template:
    src: jenkins.service.d.j2
    dest: /etc/systemd/system/jenkins.service.d/jcas.conf
    owner: root
    group: root
    mode: '0644'
  when: jenkins_manage_configuration | bool

- name: Create the Jenkins master SSH directory
  file:
    path: /var/lib/jenkins/.ssh
    state: directory
    owner: jenkins
    group: jenkins
    mode: '0700'

- name: Generate SSH keypair for master-to-agent communication
  openssh_keypair:
    path: /var/lib/jenkins/.ssh/id_ed25519
    type: ed25519
    comment: jenkins-master
    owner: jenkins
    group: jenkins
  register: ssh_keypair

- name: Retrieve the EC2 private key for the infrastructure pipeline
  command: >-
    aws ssm get-parameter
    --name {{ jenkins_ssh_private_key_ssm | quote }}
    --with-decryption
    --query Parameter.Value
    --output text
    --region {{ aws_region | quote }}
  register: jenkins_ssh_private_key
  changed_when: false
  no_log: true
  when: jenkins_manage_configuration | bool

- name: Install the EC2 private key as a Jenkins credential source file
  copy:
    content: "{{ jenkins_ssh_private_key.stdout }}\n"
    dest: /var/lib/jenkins/.ssh/labs_kp.pem
    owner: jenkins
    group: jenkins
    mode: '0600'
  no_log: true
  when: jenkins_manage_configuration | bool

- name: Verify required Jenkins SSM parameter names exist
  command: >-
    aws ssm get-parameter
    --name {{ item | quote }}
    --query Parameter.Name
    --output text
    --region {{ aws_region | quote }}
  loop:
    - "{{ jenkins_github_username_ssm }}"
    - "{{ jenkins_github_token_ssm }}"
  changed_when: false
  when: jenkins_manage_configuration | bool

- name: Check whether the optional SonarQube token exists
  command: >-
    aws ssm get-parameter
    --name {{ jenkins_sonarqube_token_ssm | quote }}
    --query Parameter.Name
    --output text
    --region {{ aws_region | quote }}
  register: jenkins_sonarqube_token_check
  changed_when: false
  failed_when: false
  when: jenkins_manage_configuration | bool

- name: Retrieve Jenkins secret values from SSM Parameter Store
  command: >-
    aws ssm get-parameter
    --name {{ item.path | quote }}
    --with-decryption
    --query Parameter.Value
    --output text
    --region {{ aws_region | quote }}
  loop:
    - { key: github_username, path: "{{ jenkins_github_username_ssm }}" }
    - { key: github_token, path: "{{ jenkins_github_token_ssm }}" }
  register: jenkins_jcas_secret_results
  changed_when: false
  no_log: true
  when: jenkins_manage_configuration | bool

- name: Build the JCasC secret-value map without exposing values in output
  set_fact:
    jenkins_jcas_values: "{{ dict(jenkins_jcas_secret_results.results | map(attribute='item.key') | zip(jenkins_jcas_secret_results.results | map(attribute='stdout'))) | combine({'sonarqube_token': ''}) }}"
    jenkins_sonarqube_token_available: "{{ jenkins_sonarqube_token_check.rc | int == 0 }}"
  no_log: true
  when: jenkins_manage_configuration | bool

- name: Retrieve the optional SonarQube token when it has been created
  command: >-
    aws ssm get-parameter
    --name {{ jenkins_sonarqube_token_ssm | quote }}
    --with-decryption
    --query Parameter.Value
    --output text
    --region {{ aws_region | quote }}
  register: jenkins_sonarqube_token
  changed_when: false
  no_log: true
  when:
    - jenkins_manage_configuration | bool
    - jenkins_sonarqube_token_available | default(false) | bool

- name: Add the optional SonarQube token to the JCasC secret map
  set_fact:
    jenkins_jcas_values: "{{ jenkins_jcas_values | combine({'sonarqube_token': jenkins_sonarqube_token.stdout}) }}"
  no_log: true
  when:
    - jenkins_manage_configuration | bool
    - jenkins_sonarqube_token_available | default(false) | bool

- name: Render the protected JCasC environment file
  template:
    src: jcas.env.j2
    dest: /etc/jenkins/jcas.env
    owner: root
    group: jenkins
    mode: '0640'
  no_log: true
  when: jenkins_manage_configuration | bool

- name: Render the declarative Jenkins configuration
  template:
    src: jenkins.yaml.j2
    dest: /var/lib/jenkins/casc_configs/jenkins.yaml
    owner: jenkins
    group: jenkins
    mode: '0640'
  when: jenkins_manage_configuration | bool

- name: Disable a previous JCasC override in manual-first mode
  file:
    path: /etc/systemd/system/jenkins.service.d/jcas.conf
    state: absent
  when: not (jenkins_manage_configuration | bool)

- name: Enable and start Jenkins with the declared configuration
  systemd:
    name: jenkins
    enabled: yes
    state: started
    daemon_reload: yes

- name: Get IMDSv2 token
  uri:
    url: http://169.254.169.254/latest/api/token
    method: PUT
    headers:
      X-aws-ec2-metadata-token-ttl-seconds: "21600"
    return_content: yes
  register: imds_token

- name: Get AWS region from instance metadata
  uri:
    url: http://169.254.169.254/latest/meta-data/placement/region
    headers:
      X-aws-ec2-metadata-token: "{{ imds_token.content }}"
    return_content: yes
  register: aws_region_meta

- name: Push master public key to SSM
  command: >
    aws ssm put-parameter
    --name "{{ ssm_parameter_name }}"
    --value "{{ ssh_keypair.public_key }}"
    --type String
    --overwrite
    --region {{ aws_region_meta.content }}
