[defaults]
inventory = inventory/aws_ec2.yml
remote_user = ubuntu
host_key_checking = False
retry_files_enabled = False
roles_path = /home/ubuntu/cicd-eks-pipeline/ansible/roles
# Pin the Python interpreter so Ansible does not warn about auto-discovery on each host
interpreter_python = /usr/bin/python3
# Use /tmp for remote temp files — works correctly with become/sudo
remote_tmp = /tmp/.ansible/tmp

[ssh_connection]
pipelining = True
