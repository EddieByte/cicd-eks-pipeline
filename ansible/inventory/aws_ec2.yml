plugin: amazon.aws.aws_ec2

regions:
  - us-east-1

filters:
  tag:Project: eddie-register-app
  instance-state-name: running

# Prefix all host variables returned by the EC2 plugin with ec2_ so that the
# raw 'tags' dict becomes 'ec2_tags' and does not collide with Ansible's
# reserved 'tags' variable name.
hostvars_prefix: ec2_

keyed_groups:
  - key: tags.Name
    separator: ""

compose:
  ansible_host: public_ip_address
  ansible_user: "'ubuntu'"
  ansible_ssh_private_key_file: "'~/.ssh/labs_kp.pem'"
  ansible_ssh_common_args: "'-o StrictHostKeyChecking=no'"
