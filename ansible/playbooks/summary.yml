---
- name: Build Jenkins access summary
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    jenkins_master: "{{ groups['Jenkins_Master'][0] }}"
    jenkins_agent: "{{ groups['Jenkins_Agent'][0] }}"
    jenkins_master_host: "{{ hostvars[jenkins_master].ansible_host }}"
    jenkins_agent_host: "{{ hostvars[jenkins_agent].ansible_host }}"
    jenkins_agent_private_host: "{{ hostvars[jenkins_agent].private_ip_address }}"
    summary_aws_region: "{{ hostvars[jenkins_master].ec2_region | default('us-east-1') }}"
    summary_path: "{{ playbook_dir }}/../../summary.yml"
    summary_markdown_path: "{{ playbook_dir }}/../../summary.md"

  tasks:
    - name: Check for Jenkins initial administrator password
      stat:
        path: /var/lib/jenkins/secrets/initialAdminPassword
      delegate_to: "{{ jenkins_master }}"
      become: true
      register: initial_password_file

    - name: Read Jenkins initial administrator password
      slurp:
        src: /var/lib/jenkins/secrets/initialAdminPassword
      delegate_to: "{{ jenkins_master }}"
      become: true
      register: jenkins_initial_password
      no_log: true
      when: initial_password_file.stat.exists

    - name: Verify Jenkins master can connect to the agent
      shell: >-
        ssh -i /home/ubuntu/.ssh/labs_kp.pem
        -o BatchMode=yes
        -o StrictHostKeyChecking=no
        -o ConnectTimeout=10
        ubuntu@{{ jenkins_master_host }}
        sudo -u jenkins -- /usr/bin/ssh
        -o BatchMode=yes
        -o StrictHostKeyChecking=no
        -o ConnectTimeout=10
        jenkins@{{ jenkins_agent_private_host }} hostname
      delegate_to: "{{ jenkins_master }}"
      register: agent_connection
      changed_when: false
      failed_when: false

    - name: Write Jenkins access summary
      copy:
        dest: "{{ summary_path }}"
        mode: '0600'
        content: |
          generated_at: "{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}"
          aws_region: "{{ summary_aws_region }}"
          ssh:
            private_key: "~/.ssh/labs_kp.pem"
            username: ubuntu
            master: "ssh -i ~/.ssh/labs_kp.pem ubuntu@{{ jenkins_master_host }}"
            agent: "ssh -i ~/.ssh/labs_kp.pem ubuntu@{{ jenkins_agent_host }}"
          jenkins:
            master_host: "{{ jenkins_master_host }}"
            url: "http://{{ jenkins_master_host }}:8080"
            initial_admin_username: admin
            initial_admin_password: >-
              {{ jenkins_initial_password.content | b64decode | trim
                 if initial_password_file.stat.exists
                 else 'unavailable - Jenkins has already completed initial setup' }}
            initial_admin_password_command: "sudo cat /var/lib/jenkins/secrets/initialAdminPassword"
            service: jenkins
            master_agent_ssh_user: jenkins
            master_agent_ssh_key: /var/lib/jenkins/.ssh/id_ed25519
            agent_connection:
              status: "{{ 'ok' if (agent_connection.rc | default(1) | int) == 0 else 'failed' }}"
              hostname: "{{ agent_connection.stdout | trim if (agent_connection.rc | default(1) | int) == 0 else '' }}"
          agent:
            host: "{{ jenkins_agent_host }}"
            private_ip: "{{ jenkins_agent_private_host }}"
            ssh_user: jenkins
            ssh_home: /home/jenkins
            docker_available: true
          next_steps:
            - Open the Jenkins URL and sign in with the initial administrator credentials.
            - Rotate the initial administrator password during Jenkins setup.
            - Configure the agent using the jenkins user and the generated master SSH key.

    - name: Write human-readable Jenkins access summary
      copy:
        dest: "{{ summary_markdown_path }}"
        mode: '0600'
        content: |
          # Jenkins Access Summary

          Generated: `{{ lookup('pipe', 'date -u +%Y-%m-%dT%H:%M:%SZ') }}`
          AWS region: `{{ summary_aws_region }}`

          ## Access

          | Item | Value |
          | --- | --- |
          | Jenkins URL | [http://{{ jenkins_master_host }}:8080](http://{{ jenkins_master_host }}:8080) |
          | Jenkins master SSH | `ssh -i ~/.ssh/labs_kp.pem ubuntu@{{ jenkins_master_host }}` |
          | Jenkins agent SSH | `ssh -i ~/.ssh/labs_kp.pem ubuntu@{{ jenkins_agent_host }}` |
          | SSH key | `~/.ssh/labs_kp.pem` |
          | SSH user | `ubuntu` |

          ## Jenkins Master-Agent Setup

          | Item | Value |
          | --- | --- |
          | Jenkins service | `jenkins` |
          | Agent host | `{{ jenkins_agent_host }}` |
          | Agent private IP | `{{ jenkins_agent_private_host }}` |
          | Agent SSH user | `jenkins` |
          | Master-agent SSH key | `/var/lib/jenkins/.ssh/id_ed25519` |
          | Connection status | `{{ 'ok' if (agent_connection.rc | default(1) | int) == 0 else 'failed' }}` |
          | Agent hostname | `{{ agent_connection.stdout | trim if (agent_connection.rc | default(1) | int) == 0 else 'unavailable' }}` |

          ## Jenkins Login

          | Item | Value |
          | --- | --- |
          | Username | `admin` |
          | Initial password | `{{ jenkins_initial_password.content | b64decode | trim if initial_password_file.stat.exists else 'unavailable - setup already completed' }}` |
          | Password command | `ssh -i ~/.ssh/labs_kp.pem ubuntu@{{ jenkins_master_host }} "sudo cat /var/lib/jenkins/secrets/initialAdminPassword"` |

          The initial password file is one-time setup data. If it is missing, use the existing Jenkins credentials or reset the password through Jenkins administration.